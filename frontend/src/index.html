<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ · เช็คชื่อเข้าเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/output.css">
</head>
<body class="login-bg grid min-h-dvh place-items-center px-4 py-10 font-sans text-zinc-100">
  <main class="w-full max-w-sm rounded-2xl border border-white/10 bg-zinc-900/80 p-8 shadow-2xl backdrop-blur-md">
    <header class="mb-8">
      <div class="mb-4 h-1 w-10 rounded-full bg-swu-red"></div>
      <p class="text-xs text-swu-grey">มหาวิทยาลัยศรีนครินทรวิโรฒ</p>
      <h1 class="mt-1 text-2xl font-semibold">เช็คชื่อเข้าเรียน</h1>
    </header>

    <form id="login-form" class="space-y-5" novalidate>
      <p id="form-error" class="hidden rounded-lg bg-red-500/10 px-4 py-3 text-sm text-red-200 ring-1 ring-red-400/30" role="alert"></p>

      <div>
        <label for="studentCode" class="mb-1.5 block text-sm text-zinc-300">รหัสนักศึกษา / รหัสอาจารย์</label>
        <input id="studentCode" name="studentCode" autocomplete="username" inputmode="numeric"
          class="block w-full rounded-lg border border-zinc-700 bg-zinc-950/60 px-4 py-2.5 text-sm text-white focus:border-swu-red focus:ring-2 focus:ring-swu-red/30 focus:outline-none aria-invalid:border-red-400">
        <p id="studentCode-error" class="mt-1.5 text-xs text-red-300"></p>
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm text-zinc-300">รหัสผ่าน</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password"
            class="block w-full rounded-lg border border-zinc-700 bg-zinc-950/60 py-2.5 pr-11 pl-4 text-sm text-white focus:border-swu-red focus:ring-2 focus:ring-swu-red/30 focus:outline-none aria-invalid:border-red-400">
          <button id="toggle-password" type="button" aria-label="แสดงรหัสผ่าน" aria-pressed="false"
            class="absolute inset-y-0 right-3 grid place-items-center text-zinc-400 hover:text-white">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
              <path id="eye-slash" d="M4 4l16 16" class="hidden" />
            </svg>
          </button>
        </div>
        <p id="password-error" class="mt-1.5 text-xs text-red-300"></p>
      </div>

      <button id="submit-btn" type="submit"
        class="w-full rounded-lg bg-swu-red px-4 py-2.5 text-sm font-medium text-white transition hover:bg-swu-red-dark focus-visible:ring-2 focus-visible:ring-white/60 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50">
        เข้าสู่ระบบ
      </button>
    </form>

    <p class="mt-6 text-sm text-zinc-400">
      ยังไม่มีบัญชี? <a href="/register" class="text-white underline underline-offset-4 hover:text-swu-grey">สมัครสมาชิก</a>
    </p>
  </main>

  <script src="/script/login.js"></script>
  <script type="module" src="/script/guest.js"></script>
</body>
</html>
