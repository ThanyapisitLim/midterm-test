<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ห้องเรียนของฉัน · เช็คชื่อเข้าเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/output.css">
</head>
<body class="invisible min-h-dvh bg-zinc-950 font-sans text-zinc-100">
  <header class="border-b border-zinc-800 bg-zinc-900/60">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="h-5 w-1 rounded-full bg-swu-red"></div>
        <span class="text-sm font-medium">เช็คชื่อเข้าเรียน</span>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <span id="nav-name" class="hidden text-zinc-400 sm:inline"></span>
        <button id="logout-btn" type="button" class="rounded-lg px-3 py-1.5 text-zinc-300 ring-1 ring-zinc-700 transition hover:bg-zinc-800">ออกจากระบบ</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl space-y-8 px-4 py-8">
    <div>
      <p class="text-xs text-swu-grey">นิสิต</p>
      <h1 class="mt-1 text-2xl font-semibold">ห้องเรียนของฉัน</h1>
    </div>

    <p id="page-error" class="hidden rounded-lg bg-red-500/10 px-4 py-3 text-sm text-red-200 ring-1 ring-red-400/30" role="alert"></p>

    <section>
      <form id="join-form" class="flex flex-col gap-3 sm:flex-row" novalidate>
        <label for="joinCode" class="sr-only">โค้ดห้องเรียน</label>
        <input id="joinCode" name="joinCode" maxlength="20" autocomplete="off" autocapitalize="characters" placeholder="โค้ดห้องเรียนจากอาจารย์"
          class="block w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-2.5 font-mono text-sm tracking-wider text-white uppercase placeholder:font-sans placeholder:tracking-normal placeholder:text-zinc-500 placeholder:normal-case focus:border-swu-red focus:ring-2 focus:ring-swu-red/30 focus:outline-none aria-invalid:border-red-400">
        <button id="join-btn" type="submit"
          class="shrink-0 rounded-lg bg-swu-red px-5 py-2.5 text-sm font-medium text-white transition hover:bg-swu-red-dark focus-visible:ring-2 focus-visible:ring-white/60 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50">
          เข้าร่วมห้องเรียน
        </button>
      </form>
      <p id="join-error" class="mt-1.5 text-xs text-red-300"></p>
    </section>

    <section id="classroom-list" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>

    <p id="empty" class="hidden rounded-xl border border-dashed border-zinc-800 px-4 py-10 text-center text-sm text-zinc-500">
      ยังไม่ได้เข้าร่วมห้องเรียนใด ขอโค้ดจากอาจารย์แล้วกรอกในช่องด้านบน
    </p>
  </main>

  <script type="module" src="/script/student-home.js"></script>
</body>
</html>
