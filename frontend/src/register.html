<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก · เช็คชื่อเข้าเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/output.css">
</head>
<body class="login-bg grid min-h-dvh place-items-center px-4 py-10 font-sans text-zinc-100">
  <main class="w-full max-w-sm rounded-2xl border border-white/10 bg-zinc-900/80 p-8 shadow-2xl backdrop-blur-md">
    <header class="mb-8">
      <div class="mb-4 h-1 w-10 rounded-full bg-swu-red"></div>
      <p class="text-xs text-swu-grey">มหาวิทยาลัยศรีนครินทรวิโรฒ</p>
      <h1 class="mt-1 text-2xl font-semibold">สมัครสมาชิก</h1>
    </header>

    <form id="register-form" class="space-y-5" novalidate>
      <p id="form-error" class="hidden rounded-lg bg-red-500/10 px-4 py-3 text-sm text-red-200 ring-1 ring-red-400/30" role="alert"></p>

      <fieldset class="grid grid-cols-2 gap-1 rounded-lg bg-zinc-950/60 p-1 ring-1 ring-zinc-700">
        <legend class="sr-only">สมัครในฐานะ</legend>
        <label class="cursor-pointer">
          <input type="radio" name="role" value="student" class="peer sr-only" checked>
          <span class="block rounded-md py-2 text-center text-sm text-zinc-400 transition peer-checked:bg-swu-red peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-white/60">นักศึกษา</span>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="role" value="teacher" class="peer sr-only">
          <span class="block rounded-md py-2 text-center text-sm text-zinc-400 transition peer-checked:bg-swu-red peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-white/60">อาจารย์</span>
        </label>
      </fieldset>

      <div>
        <label for="fullName" class="mb-1.5 block text-sm text-zinc-300">ชื่อ-นามสกุล</label>
        <input id="fullName" name="fullName" autocomplete="name" maxlength="100"
          class="block w-full rounded-lg border border-zinc-700 bg-zinc-950/60 px-4 py-2.5 text-sm text-white focus:border-swu-red focus:ring-2 focus:ring-swu-red/30 focus:outline-none aria-invalid:border-red-400">
        <p id="fullName-error" class="mt-1.5 text-xs text-red-300"></p>
      </div>

      <div>
        <label id="code-label" for="studentCode" class="mb-1.5 block text-sm text-zinc-300">รหัสนักศึกษา</label>
        <input id="studentCode" name="studentCode" autocomplete="username" inputmode="numeric"
          class="block w-full rounded-lg border border-zinc-700 bg-zinc-950/60 px-4 py-2.5 text-sm text-white focus:border-swu-red focus:ring-2 focus:ring-swu-red/30 focus:outline-none aria-invalid:border-red-400">
        <p id="studentCode-error" class="mt-1.5 text-xs text-red-300"></p>
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm text-zinc-300">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
          class="block w-full rounded-lg border border-zinc-700 bg-zinc-950/60 px-4 py-2.5 text-sm text-white focus:border-swu-red focus:ring-2 focus:ring-swu-red/30 focus:outline-none aria-invalid:border-red-400">
        <p class="mt-1.5 text-xs text-zinc-500">อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข</p>
        <p id="password-error" class="mt-1 text-xs text-red-300"></p>
      </div>

      <div>
        <label for="confirmPassword" class="mb-1.5 block text-sm text-zinc-300">ยืนยันรหัสผ่าน</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
          class="block w-full rounded-lg border border-zinc-700 bg-zinc-950/60 px-4 py-2.5 text-sm text-white focus:border-swu-red focus:ring-2 focus:ring-swu-red/30 focus:outline-none aria-invalid:border-red-400">
        <p id="confirmPassword-error" class="mt-1.5 text-xs text-red-300"></p>
      </div>

      <button id="submit-btn" type="submit"
        class="w-full rounded-lg bg-swu-red px-4 py-2.5 text-sm font-medium text-white transition hover:bg-swu-red-dark focus-visible:ring-2 focus-visible:ring-white/60 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50">
        สมัครสมาชิก
      </button>
    </form>

    <p class="mt-6 text-sm text-zinc-400">
      มีบัญชีแล้ว? <a href="/" class="text-white underline underline-offset-4 hover:text-swu-grey">เข้าสู่ระบบ</a>
    </p>
  </main>

  <script src="/script/register.js"></script>
</body>
</html>
